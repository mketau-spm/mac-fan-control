name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build, test and sign (ad-hoc)
        run: scripts/build.sh

      - name: Package app
        run: ditto -c -k --keepParent build/FanCurve.app build/FanCurve.zip

      - uses: actions/upload-artifact@v4
        with:
          name: FanCurve
          path: build/FanCurve.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FanCurve
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" FanCurve.zip --repo "$GITHUB_REPOSITORY" --title "FanCurve $TAG" \
            --notes "See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/CHANGELOG.md). The app is signed ad-hoc, not notarized: see the README for how to open it."
